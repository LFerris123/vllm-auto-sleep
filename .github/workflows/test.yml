name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mock-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q proxy.py tests
      - run: python tests/sleep_proxy_mock_e2e.py
